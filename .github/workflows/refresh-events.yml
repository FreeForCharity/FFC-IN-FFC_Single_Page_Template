name: Refresh Events Snapshot

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch latest events
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Fetch events from all configured sources
        env:
          EVENTS_GOOGLE_ICS_URL: ${{ secrets.EVENTS_GOOGLE_ICS_URL }}
          EVENTS_MICROSOFT_ICS_URL: ${{ secrets.EVENTS_MICROSOFT_ICS_URL }}
          EVENTS_FACEBOOK_PAGE_ID: ${{ secrets.EVENTS_FACEBOOK_PAGE_ID }}
          EVENTS_FACEBOOK_ACCESS_TOKEN: ${{ secrets.EVENTS_FACEBOOK_ACCESS_TOKEN }}
        run: node scripts/fetch-events.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain src/data/events.generated.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/events.generated.json
            git commit -m "chore(events): refresh snapshot from calendar sources"
            git push
          else
            echo "No changes to events snapshot."
          fi
