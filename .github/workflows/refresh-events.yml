name: Refresh Events Snapshot

# Fetches the latest events from the configured calendar sources and, when the
# committed snapshot changed, opens (or updates) a pull request on a fixed
# automation branch. It NEVER pushes to main: main is protected and every
# change must ride through the normal PR checks (CI, drift-check,
# phantom-revert-guard). Merging the PR triggers the regular deploy.
#
# Requires up to 4 repository secrets (all optional — unset sources are
# skipped): EVENTS_GOOGLE_ICS_URL, EVENTS_MICROSOFT_ICS_URL,
# EVENTS_FACEBOOK_PAGE_ID, EVENTS_FACEBOOK_ACCESS_TOKEN. See EVENTS_SETUP.md.

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # push the automation/events-refresh branch
  pull-requests: write # open/update the refresh PR

concurrency:
  group: refresh-events
  cancel-in-progress: true

env:
  REFRESH_BRANCH: automation/events-refresh

jobs:
  refresh:
    name: Fetch latest events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch events from all configured sources
        env:
          EVENTS_GOOGLE_ICS_URL: ${{ secrets.EVENTS_GOOGLE_ICS_URL }}
          EVENTS_MICROSOFT_ICS_URL: ${{ secrets.EVENTS_MICROSOFT_ICS_URL }}
          EVENTS_FACEBOOK_PAGE_ID: ${{ secrets.EVENTS_FACEBOOK_PAGE_ID }}
          EVENTS_FACEBOOK_ACCESS_TOKEN: ${{ secrets.EVENTS_FACEBOOK_ACCESS_TOKEN }}
          # Unlike prebuild (which must never break the site build), a crashed
          # scheduled refresh must turn the run red — exit 0 here would make it
          # indistinguishable from a quiet no-change run.
          EVENTS_FAIL_ON_ERROR: '1'
        run: node scripts/fetch-events.mjs

      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain src/data/events.generated.json)" ]; then
            echo "No changes to events snapshot."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fixed branch, force-pushed from the current default branch each
          # run: the PR always carries exactly one commit with the newest
          # snapshot, and successive refreshes update the same PR instead of
          # piling up branches.
          git checkout -B "$REFRESH_BRANCH"
          git add src/data/events.generated.json
          git commit -m "chore(events): refresh snapshot from calendar sources"
          git push --force origin "HEAD:$REFRESH_BRANCH"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$REFRESH_BRANCH" --base "${GITHUB_REF_NAME}" \
            --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Refresh PR #$existing already open; branch updated."
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$REFRESH_BRANCH" --base "${GITHUB_REF_NAME}" \
            --title "chore(events): refresh events snapshot" \
            --body "$(printf '%s\n' \
              'Automated events-snapshot refresh from the configured calendar sources.' \
              '' \
              'Generated by `.github/workflows/refresh-events.yml`. Successive scheduled' \
              'runs force-update this same branch, so this PR always shows the newest' \
              'snapshot. Merging deploys it through the normal pipeline.' \
              '' \
              'Refs #267')"
